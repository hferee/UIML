name: Build doc

on:
  push:
    # Do not run the ci if the only modified
    # files are the latex document
    paths-ignore:
      - "jfla-paper/**"
  pull_request:
    paths-ignore:
      - "jfla-paper/**"

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest

    # Avoid running twice the action if it's triggered by a push on a PR from a branch on the repo.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name

    container:
      image: coqorg/coq:8.20.1
      # This is a workaround a "bug" on the checkout action,
      # see https://github.com/actions/checkout/issues/956
      options: --user root

    steps:
      - uses: actions/checkout@master
      - name: "Run coq-community/docker-coq-action@v1 with debian:10"
        uses: coq-community/docker-coq-action@v1
        with:
          custom_image: coqorg/coq:8.20.1
          # Explanation for the permission issue:
          # https://github.com/coq-community/docker-coq-action#permissions
          before_script: |
            startGroup "Workaround permission issue"
              sudo chown -R coq:coq .  # <--
            endGroup
          script: |
            startGroup "Build project"
              opam update -y
              ./install.sh -y
              make -j 4 pretty-timed
              make -j 4 doc
              dune exec benchmark > benchmark.md
            endGroup
          uninstall: |
            startGroup "Clean project"
              make clean
            endGroup

      - name: Upload docs
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Upload benchmark
        uses: actions/upload-artifact@v7
        with:
          name: Benchmark
          path: benchmark.md

      - name: Upload build time log
        uses: actions/upload-artifact@v7
        with:
          name: Time Log
          path: time-of-build-pretty.log

      - name: Revert permissions
        # to avoid a warning at cleanup time
        if: ${{ always() }}
        run: sudo chown -R 1001:116 . # <--

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      pages: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
